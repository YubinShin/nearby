spring:
  application:
    name: indexer-batch

  config:
    import: classpath:core.yml

  datasource:
    url: jdbc:postgresql://localhost:5432/place
    username: place
    password: place
    hikari:
      maximum-pool-size: 8

  batch:
    job:
      enabled: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: indexer-batch

psp:
  index:
    checkpoint-index: psp_index_checkpoint
    batch-size: 2000

    fetch-size: 1000

    keep-versions: 2

    schedule:
      enabled: false
      incremental-cron: "0 */5 * * * *"
      full-cron: "0 30 4 * * *"

  vector:
    batch-size: 500

  embedding:
    batch-size: 64

  metrics:
    lag-refresh-ms: 10000
