spring:
  application:
    name: search-api

  # 색인기와 **같아야 하는** 설정은 search-core 가 소유한다 (ES 주소·alias·임베딩 설정).
  # 여기에 복사해 두면 언젠가 한쪽만 바뀌고, 그 사고는 예외 없이 결과만 이상하게 만든다.
  config:
    import: classpath:core.yml

server:
  port: 8080

spring.web.resources.cache.cachecontrol:
  # 앱이 서빙하는 비교 페이지(static/index.html)는 **개발·시연용**이라 매번 최신이어야 한다.
  # 기본값이면 브라우저가 옛 HTML 을 붙들고 있어서 "고쳤는데 화면이 그대로"가 된다 (실제로 겪었다).
  # 정적 자산이 늘어나면 파일명 해시를 붙이고 이 설정을 되돌리는 게 맞다.
  no-cache: true
  must-revalidate: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: search-api
  # 질의 지연은 평균이 아니라 꼬리(p95/p99)로 봐야 의미가 있다.
  distribution:
    percentiles-histogram:
      psp.query.latency: true
      psp.query.stage.latency: true
    slo:
      psp.query.latency: 10ms, 25ms, 50ms, 100ms, 250ms, 500ms

psp:
  vector:
    # 코사인 유사도 문턱. 벡터 검색은 "0건"이 없어서 이 선이 없으면 아무 말에나 답을 준다.
    # 실측으로 정한 값: 진짜 질의 20개는 전부 통과(최소 5건 확보)하면서 엉터리 질의 12개 중
    # 10개를 막는 지점. 0.86 으로 올리면 진짜 질의 8개가 0건이 된다 — ADR 0010 분포표 참고.
    min-score: 0.84
    # 질의 임베딩 LRU 캐시 크기(한 프로세스 안).
    cache-size: 2000

  # 하이브리드 결합 — 6단계 (ADR 0003)
  hybrid:
    # 벡터 채널이 꺼진 노드에서는 자동으로 같이 꺼진다(조건에 psp.vector.enabled 가 함께 걸려 있다).
    enabled: true
    # RRF 완충값. 클수록 상위권 등수 차이가 평평해져 '두 채널의 합의'가 '한 채널의 1등'을 이긴다.
    k: 60
    # 각 채널에서 가져올 후보 수. 최종 페이지(size)보다 깊어야 결합의 이득이 생긴다.
    candidates: 50
    # 채널 가중치. 1:1 이 기본이고, 한쪽을 신뢰하지 못할 때 낮춘다.
    keyword-weight: 1.0
    vector-weight: 1.0
