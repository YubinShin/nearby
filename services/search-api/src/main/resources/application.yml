spring:
  application:
    name: search-api

  config:
    import: classpath:core.yml

  elasticsearch:
    connection-timeout: 1s
    socket-timeout: 2s

server:
  port: 8080

spring.web.resources.cache.cachecontrol:
  no-cache: true
  must-revalidate: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: search-api
    distribution:
      percentiles-histogram:
        psp.query.latency: true
        psp.query.stage.latency: true
        psp.query.embed.wait: true
      slo:
        psp.query.latency: 10ms, 25ms, 50ms, 100ms, 250ms, 500ms
        psp.query.embed.wait: 1ms, 5ms, 10ms, 25ms, 50ms, 100ms, 250ms
  prometheus:
    metrics:
      export:
        enabled: true

psp:
  vector:
    min-score: 0.84
    cache-size: 2000

  embedding:
    gate:
      max-queue: 32
      wait-timeout: 250ms

  hybrid:
    enabled: true
    k: 60
    candidates: 50
    keyword-weight: 1.0
    vector-weight: 1.0
