spring:
  application:
    name: search-api

  # Elasticsearch (리액티브 클라이언트) — 로컬 docker compose 기준. 0-2 단계에서 기동.
  elasticsearch:
    uris: http://localhost:9200

  # PostGIS 원천 창고 (R2DBC) — 색인기가 여기서 읽어 ES로 옮김.
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/place
    username: place
    password: place

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info

# 색인 파이프라인 설정
psp:
  index:
    search-alias: place_search
    suggest-alias: place_suggest
    checkpoint-index: psp_index_checkpoint
    batch-size: 2000
