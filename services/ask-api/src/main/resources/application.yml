spring:
  application:
    name: ask-api

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: ask-api
    distribution:
      percentiles-histogram:
        psp.ask.latency: true
  prometheus:
    metrics:
      export:
        enabled: true

psp:
  ask:
    llm: gemini
    size: 20

    search:
      base-url: http://localhost:8080
      timeout-ms: 5000

    corpus:
      lexicon: classpath:corpus/unsupported-filters.json

    gemini:
      base-url: https://generativelanguage.googleapis.com
      model: gemini-3.5-flash
      api-key: ${GEMINI_API_KEY:}
      timeout-ms: 10000

    fixtures:
      location: classpath:fixtures/
