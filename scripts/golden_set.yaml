# 골든셋 — /v1/ask 의 정답 데이터 (라벨링 전)
#
# `scripts/queries_regression.txt` 의 20개를 그대로 옮기고, 코퍼스가 담지 못하는 축
# (평점·영업시간·배달·가격)을 찌르는 트랩 질의 4개를 더했습니다
# (docs/data-model.md "이 데이터가 담지 못하는 것").
# 트랩의 정답은 0건이 아니라 **속성을 뺀 나머지**입니다. `평점 4.5 이상 카페` 는 카페가 정답이고,
# 축을 인지했는지는 응답의 unsupported 로 따로 검증합니다 (ADR 0014 결정 5).
#
# `scripts/record_llm_fixtures.py` 가 이 파일의 query 를 읽어 LLM 응답을 녹화합니다.
#
# 라벨은 **비어 있습니다.** 채우는 방법은 services/ask-api/README.md 의 "골든셋 라벨링".
#   expected_places  — 이 질의에 나와야 하는 place_id 목록 (TODO_HUMAN_LABEL)
#   expect_empty     — 결과가 0건이어야 맞는 질의인지 (TODO_HUMAN_LABEL)
#
# 트랩 4개의 expect_empty 만 false 로 채워져 있습니다. 관측이 아니라 명세입니다.

