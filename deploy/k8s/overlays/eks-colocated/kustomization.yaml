apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../eks

patches:
  - target: { kind: Deployment, name: search-api }
    patch: |
      - op: replace
        path: /spec/template/spec/nodeSelector
        value: { role: index }
  - target: { kind: StatefulSet, name: elasticsearch }
    patch: |
      - op: replace
        path: /spec/template/spec/nodeSelector
        value: { role: index }
  - target: { kind: StatefulSet, name: qdrant }
    patch: |
      - op: replace
        path: /spec/template/spec/nodeSelector
        value: { role: index }

  - target: { kind: Deployment, name: search-api }
    patch: |
      - op: remove
        path: /spec/template/spec/affinity
  - target: { kind: Deployment, name: indexer-batch }
    patch: |
      - op: remove
        path: /spec/template/spec/affinity
