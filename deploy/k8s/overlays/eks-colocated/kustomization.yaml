apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 대조군(패스 B) — **노드 분리의 순효과를 재기 위한 오버레이다.**
#
# ## 왜 이게 필요한가
# ADR 0011 표의 ❌ 칸("색인이 질의 지연을 밀어올리는 것 — 같은 머신이면 그대로 경쟁한다")을
# 채우려면 "합쳤을 때"와 "나눴을 때"를 비교해야 한다. 그런데 기존 비교 대상인
# 11.5ms → 23.4ms (배수 벡터 2.03 · 키워드 1.32)는 그 자리에 쓸 수 없다:
#
#   · 환경이 EKS 도 kind 도 아니다 — **로컬 docker-compose** 다. ADR 0011 과 README 는
#     "로컬에서는 같은 CPU를 나눠 쓴다"고 정확히 적고 있다. 벡터 재색인 879초가 그 증거다
#     (kind 2코어는 1,963초, 로컬 유휴는 ~492초 → 질의 4워커에 밀려 879초).
#   · 런타임이 다르다 — 측정 커밋(ae40131, 07-24 19:00)이 Spring Batch 리팩터
#     (f12a9bb, 07-25 16:40)보다 **앞선다**. 즉 리액티브 색인기에서 잰 값이다.
#
# 그대로 비교하면 런타임 × 환경 × 토폴로지가 한꺼번에 바뀐다. `cluster.yaml` 이 색인기
# 메모리를 일부러 안 건드리며 세워둔 "한 번에 하나만 바꾼다" 원칙을 비교 기준이 위반하는 셈이다.
#
# ## 그래서 대조군도 같은 클러스터에서 돌린다
# `overlays/eks` 를 그대로 상속한다 → 이미지·CPU 한도(requests 6 / limits 7)·메모리·gp3 가
# **전부 같고**, 바뀌는 것은 파드가 어느 노드에 놓이는지 **하나**다.
#
# ## 쓰는 법 (한 클러스터에서 두 번 잰다)
#   패스 A(분리):  kubectl kustomize deploy/k8s/overlays/eks           | sed s/<ACCOUNT>/…/ | kubectl apply -f -
#   패스 B(합침):  kubectl kustomize deploy/k8s/overlays/eks-colocated | sed s/<ACCOUNT>/…/ | kubectl apply -f -
#
# 각 패스에서 `verify_zero_downtime.py` 를 돌리고 **패스 안에서의 유휴 대비 배수**를 비교한다.
# ⚠️ 두 패스의 지연 **절대값을 비교하지 말 것** — B 는 c7i.2xlarge, A 의 질의 노드는 m7i.xlarge 라
#    하드웨어가 다르다. 비교 가능한 건 각 패스 내부에서 정규화된 배수뿐이다.
#
# ## 파드 스펙을 일부러 안 건드린다
# 색인기 `requests.cpu: 6` 이라 CFS 가중치가 커서, 합친 노드에서 색인기가 CPU 를 크게
# 가져간다(가중치 6000 대 질의기 250). 그게 바로 "같은 스펙을 한 노드에 얹으면 벌어지는 일"이고
# 재려는 대상이다. 여기서 6 을 낮추면 "합쳤다"와 "요청을 줄였다"가 섞여 다시 변수가 둘이 된다.

resources:
  - ../eks

patches:
  # ── 질의 경로를 색인 노드로 옮긴다 ──
  # 합치는 방향은 **반드시 색인 노드(c7i.2xlarge, 8 vCPU)** 쪽이다. 반대로 질의 노드
  # (m7i.xlarge, 4 vCPU)에 몰면 색인기 requests.cpu 6 이 안 들어가 영구 Pending 이 된다.
  # 이 방향이면 요청 합 6.7(색인기 6 + 질의기 .25 + ES .25 + Qdrant .1 + PostGIS .1)에
  # 데몬셋 ~0.35 를 더해도 할당가능 ~7.9 아래다.
  #
  # ES·Qdrant 도 같이 옮긴다 — 안 옮기면 "질의 경로가 색인기와 같은 노드"라는 조건이
  # 반쪽만 성립해서, 패스 A 와 정확히 대칭이 되지 않는다.
  - target: { kind: Deployment, name: search-api }
    patch: |
      - op: replace
        path: /spec/template/spec/nodeSelector
        value: { role: index }
  - target: { kind: StatefulSet, name: elasticsearch }
    patch: |
      - op: replace
        path: /spec/template/spec/nodeSelector
        value: { role: index }
  - target: { kind: StatefulSet, name: qdrant }
    patch: |
      - op: replace
        path: /spec/template/spec/nodeSelector
        value: { role: index }

  # ── anti-affinity 를 뺀다 ──
  # `overlays/eks` 가 required 로 굳혀놨으므로 그대로 두면 색인기와 질의기가 같은 노드에
  # 못 올라가고 둘 중 하나가 영구 Pending 이 된다. 합치는 게 목적이니 규칙 자체를 제거한다.
  # (nodeSelector 로 둘을 같은 노드에 보내면서 anti-affinity 를 남겨두는 건 모순이다.)
  - target: { kind: Deployment, name: search-api }
    patch: |
      - op: remove
        path: /spec/template/spec/affinity
  - target: { kind: Deployment, name: indexer-batch }
    patch: |
      - op: remove
        path: /spec/template/spec/affinity
