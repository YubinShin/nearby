apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: nearby-search-api
    newName: <ACCOUNT>.dkr.ecr.ap-northeast-2.amazonaws.com/nearby-search-api
    newTag: latest
  - name: nearby-indexer-batch
    newName: <ACCOUNT>.dkr.ecr.ap-northeast-2.amazonaws.com/nearby-indexer-batch
    newTag: latest
  - name: nearby-postgis
    newName: <ACCOUNT>.dkr.ecr.ap-northeast-2.amazonaws.com/nearby-postgis
    newTag: seeded
  - name: psp-elasticsearch-komoran
    newName: <ACCOUNT>.dkr.ecr.ap-northeast-2.amazonaws.com/psp-elasticsearch-komoran
    newTag: 9.4.2

patches:
  - target: { kind: Deployment, name: search-api }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { role: query }
  - target: { kind: StatefulSet, name: elasticsearch }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { role: query }
  - target: { kind: StatefulSet, name: qdrant }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { role: query }
  - target: { kind: Deployment, name: indexer-batch }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { role: index }
  - target: { kind: StatefulSet, name: postgis }
    patch: |
      - op: add
        path: /spec/template/spec/nodeSelector
        value: { role: index }

  - target: { kind: Deployment, name: indexer-batch }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "6"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "7"

  - target: { kind: Deployment, name: indexer-batch }
    patch: |
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }

  - target: { kind: Deployment, name: search-api }
    patch: |
      - op: replace
        path: /spec/template/spec/affinity/podAntiAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: indexer-batch }
              topologyKey: kubernetes.io/hostname
  - target: { kind: Deployment, name: indexer-batch }
    patch: |
      - op: replace
        path: /spec/template/spec/affinity/podAntiAffinity
        value:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: search-api }
              topologyKey: kubernetes.io/hostname
  - target: { kind: StatefulSet, name: elasticsearch }
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
  - target: { kind: StatefulSet, name: qdrant }
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
  - target: { kind: StatefulSet, name: postgis }
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3
