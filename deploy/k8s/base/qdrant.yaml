# Qdrant — 벡터(뜻) 검색 엔진 (ADR 0007, 0010).
# 공개 멀티아치 이미지라 클러스터가 레지스트리에서 직접 당긴다(kind load 불필요).
#
# StatefulSet 인 이유는 elasticsearch.yaml 과 같다: 벡터 컬렉션이 디스크에 있다.
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: nearby
  labels: { app: qdrant }
spec:
  clusterIP: None
  selector: { app: qdrant }
  ports:
    - { name: rest, port: 6333, targetPort: 6333 }
    - { name: grpc, port: 6334, targetPort: 6334 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: nearby
  labels: { app: qdrant }
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.4
          ports:
            - { name: rest, containerPort: 6333 }
            - { name: grpc, containerPort: 6334 }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { memory: "1Gi" }
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: storage }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 3Gi }
