---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: nearby
  labels: { app: elasticsearch }
spec:
  clusterIP: None
  selector: { app: elasticsearch }
  ports:
    - name: http
      port: 9200
      targetPort: 9200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: nearby
  labels: { app: elasticsearch }
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels: { app: elasticsearch }
  template:
    metadata:
      labels: { app: elasticsearch }
    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: sysctl-max-map-count
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: psp-elasticsearch-komoran:9.4.2
          imagePullPolicy: IfNotPresent
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }
            - { name: ES_JAVA_OPTS, value: "-Xms1g -Xmx1g" }
          ports:
            - { name: http, containerPort: 9200 }
          resources:
            requests: { cpu: "250m", memory: "1536Mi" }
            limits:   { memory: "2Gi" }
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
            - name: komoran-dict
              mountPath: /usr/share/elasticsearch/config/analysis/komoran
              readOnly: true
          readinessProbe:
            httpGet: { path: /_cluster/health, port: 9200 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
      volumes:
        - name: komoran-dict
          configMap:
            name: komoran-dict
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
