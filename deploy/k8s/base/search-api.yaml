---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: nearby
  labels: { app: search-api }
spec:
  selector: { app: search-api }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: nearby
  labels: { app: search-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: search-api }
  template:
    metadata:
      labels: { app: search-api }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: indexer-batch }
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-elasticsearch
          image: busybox:1.36
          envFrom:
            - configMapRef: { name: search-backends }
          command:
            - sh
            - -c
            - |
              until wget -q -O /dev/null "$SPRING_ELASTICSEARCH_URIS/_cluster/health?wait_for_status=yellow&timeout=5s"; do
                echo "elasticsearch 대기 중..."
                sleep 2
              done
      containers:
        - name: search-api
          image: nearby-search-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: search-backends }
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits:   { memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
