# search-api — 질의 앱 (ADR 0011). /v1/* + 벡터 + 하이브리드 RRF + 비교 UI.
# /admin 도, PostGIS 연결도 여기 없다 — 플래그로 끈 게 아니라 클래스가 jar 에 없다.
#
# 자원 성격: 저지연·상시 가동. 색인기와 **정반대**라 같은 노드에 묶을 이유가 없다(anti-affinity).
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: nearby
  labels: { app: search-api }
spec:
  selector: { app: search-api }
  ports:
    - { name: http, port: 80, targetPort: 8080 }
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: nearby
  labels: { app: search-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: search-api }
  template:
    metadata:
      labels: { app: search-api }
    spec:
      # ── 분리의 값을 여기서 지킨다 ─────────────────────────────────────────
      # 색인기와 질의기를 **다른 노드**에 놓으려 한다. 같은 노드면 색인기의 임베딩 배치가
      # CPU 를 태울 때 질의 지연이 함께 튄다 — 분리했는데 자원은 안 나뉜 상태다
      # (로컬 docker-compose 실측 11.5→23.4ms. **kind 가 아니라 로컬**이고 리액티브 색인기
      #  시절 값이라, EKS 결과의 비교 기준으로는 쓸 수 없다 — overlays/eks-colocated 참고).
      # base 에서는 preferred(단일 노드 kind 에서도 뜬다). eks 오버레이가 required 로 굳혀
      # 진짜 다른 노드로 강제한다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: indexer-batch }
                topologyKey: kubernetes.io/hostname
      # ES 가 뜨기 전에 시작하면 컨텍스트 refresh 자체가 실패한다 — 부팅 중에 Rest5Client 가
      # ES 로 요청을 쏘기 때문이다(스택: Rest5Client.performRequest → AsyncConnectExec).
      # indexer-batch 가 PostGIS 로 겪은 것과 같은 모양이고, 아픈 곳도 같다: CrashLoopBackOff
      # 의 지수 백오프(10s→20s→40s→80s) 때문에 **ES 가 준비된 뒤에도 몇 분을 더 죽어 있는다.**
      # EKS 에서는 그게 곧 과금 시간이고, 특히 패스 B 에서 ES 가 노드를 옮기며 EBS 를
      # 재부착하는 동안 이 백오프에 걸리면 재측정 시작이 그만큼 밀린다.
      #
      # Qdrant 는 기다리지 않는다 — 클라이언트가 lazy 라 부팅을 막지 않고, 컬렉션이 없으면
      # 질의 시점에 500 을 낼 뿐이다(kind 리허설에서 확인). 부팅을 죽이는 것만 기다린다.
      initContainers:
        - name: wait-for-elasticsearch
          image: busybox:1.36
          # 주소를 여기 하드코딩하지 않고 앱과 **같은 ConfigMap** 에서 받는다 — 안 그러면
          # backend-wiring.yaml 을 고쳤을 때 둘이 조용히 어긋난다.
          envFrom:
            - configMapRef: { name: search-backends }
          command:
            - sh
            - -c
            # TCP 만 보면 안 된다 — ES 는 클러스터가 서빙 준비되기 전에 9200 을 먼저 연다.
            # 단일 노드는 복제본이 배정 안 돼 green 이 아니라 **yellow** 가 정상이다.
            # wait_for_status 로 ES 쪽에서 블록시키니 폴링이 촘촘할 필요도 없다.
            - |
              until wget -q -O /dev/null "$SPRING_ELASTICSEARCH_URIS/_cluster/health?wait_for_status=yellow&timeout=5s"; do
                echo "elasticsearch 대기 중..."
                sleep 2
              done
      containers:
        - name: search-api
          image: nearby-search-api:latest
          imagePullPolicy: IfNotPresent   # kind 로 load 한 로컬 이미지.
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: search-backends }
          resources:
            # 힙은 이미지에서 컨테이너 메모리의 50%(-XX:MaxRAMPercentage). 나머지 절반은
            # ONNX 네이티브(임베딩)가 쓴다. 한계를 이 비율에 맞춰 잡지 않으면 힙 여유가 있어도
            # 네이티브 할당 실패로 OOMKilled 가 난다.
            requests: { cpu: "250m", memory: "1Gi" }
            limits:   { memory: "2Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
