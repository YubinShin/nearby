apiVersion: v1
data:
  manual.dict: "# KOMORAN 사용자 사전 — 사람이 관리하는 시드 (자동 생성분과 합쳐져 place.dict 가 된다)\n#\n#
    형식: 단어<TAB>품사   ('#'로 시작하는 줄과 빈 줄은 무시)\n#\n# 왜 손으로 관리하는 파일이 따로 필요한가\n#   자동 생성기(scripts/build_komoran_dict.py)는
    **원천 데이터에 충분히 나타나는** 어휘만 잡는다.\n#   그런데 사람이 검색창에 치는 말은 상호명에 잘 안 박힌다 — '브런치'는 강남구
    상호명에 4건뿐이라\n#   빈도 임계를 못 넘는다. 그 간극을 여기서 메운다.\n#\n# 등재 기준 (중요 — 많이 넣는 게 좋은 게 아니다)\n#
    \  ✅ 넣는다:   한 글자/자모로 **산산조각** 나고, 그 조각이 독립적 의미가 없는 것\n#                브런치 ->
    브·런·치   |  크로플 -> 크·로·프·ㄹ   |  두피케어 -> 두피·하·게·이·어\n#   ❌ 안 넣는다: 조각이 **그 자체로 검색어가
    되는** 합성어. 통짜로 만들면 부분 검색이 죽는다.\n#                스터디카페 -> 스터디·카페 (정상! '카페'로 찾을
    수 있어야 한다)\n#                코인노래방 -> 코인·노래방 (정상)\n#   ❌ 안 넣는다: 이미 KOMORAN이 통짜로
    아는 것 (스타벅스·베이커리·삼겹살 등). 넣어도 무의미.\n#\n# 여기에 넣기 전에 반드시 확인:\n#   curl -s localhost:9200/komoran_probe/_analyze
    -H 'Content-Type: application/json' \\\n#     -d '{\"analyzer\":\"komoran_raw\",\"text\":\"브런치\"}'\n#\n#
    새 항목의 주 출처는 **검색 로그의 0건 질의**다 → scripts/mine_query_log.py\n\n# --- 음식·카페 어휘 (질의에
    자주 쓰이나 상호명 빈도는 낮음) ---\n브런치\tNNP\n오마카세\tNNP\n마카롱\tNNP\n크로플\tNNP\n스무디\tNNP\n라떼\tNNP\n아메리카노\tNNP\n리조또\tNNP\n\n#
    --- 생활·서비스 업종 ---\n필라테스\tNNP\n스피닝\tNNP\n왁싱\tNNP\n두피케어\tNNP\n코워킹\tNNP\n\n# ---
    브랜드 (원천에 프랜차이즈 직영점이 누락돼 자동 추출로는 안 잡힘) ---\n노티드\tNNP\n다이소\tNNP\n이디야\tNNP\n컴포즈\tNNP\n\n#
    --- 신조어·평가어 (상호명엔 거의 없고 질의에만 나타남) ---\n혼밥\tNNP\n존맛탱\tNNP\n핫플\tNNP\n웨이팅\tNNP\n"
