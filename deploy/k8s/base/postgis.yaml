---
apiVersion: v1
kind: Service
metadata:
  name: postgis
  namespace: nearby
  labels: { app: postgis }
spec:
  clusterIP: None
  selector: { app: postgis }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgis
  namespace: nearby
  labels: { app: postgis }
spec:
  serviceName: postgis
  replicas: 1
  selector:
    matchLabels: { app: postgis }
  template:
    metadata:
      labels: { app: postgis }
    spec:
      containers:
        - name: postgis
          image: nearby-postgis:seeded
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_DB, value: place }
            - { name: POSTGRES_USER, value: place }
            - { name: POSTGRES_PASSWORD, value: place }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports:
            - { name: postgres, containerPort: 5432 }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { memory: "1Gi" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "place", "-d", "place"]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 3Gi }
