---
apiVersion: v1
kind: Service
metadata:
  name: indexer-batch
  namespace: nearby
  labels: { app: indexer-batch }
spec:
  selector: { app: indexer-batch }
  ports:
    - { name: http, port: 80, targetPort: 8081 }
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer-batch
  namespace: nearby
  labels: { app: indexer-batch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: indexer-batch }
  template:
    metadata:
      labels: { app: indexer-batch }
    spec:
      terminationGracePeriodSeconds: 630
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: search-api }
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-postgis
          image: postgres:16-alpine
          command: ['sh', '-c', 'until pg_isready -h postgis -p 5432 -U place; do echo "postgis 대기 중..."; sleep 2; done']
      containers:
        - name: indexer-batch
          image: nearby-indexer-batch:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: search-backends }
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgis:5432/place" }
            - { name: SPRING_DATASOURCE_USERNAME, value: "place" }
            - { name: SPRING_DATASOURCE_PASSWORD, value: "place" }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2", memory: "2560Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 20
