services:
  elasticsearch:
    build:
      context: ./elasticsearch
    image: psp-elasticsearch-komoran:9.4.2
    container_name: psp-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./elasticsearch/analysis:/usr/share/elasticsearch/config/analysis:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: psp-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: psp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgis:
    image: postgis/postgis:16-3.4
    container_name: psp-postgis
    environment:
      - POSTGRES_DB=place
      - POSTGRES_USER=place
      - POSTGRES_PASSWORD=place
    ports:
      - "5432:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U place -d place"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  es-data:
  qdrant-data:
  redis-data:
  postgis-data:
